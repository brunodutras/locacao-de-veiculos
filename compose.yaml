services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_apenas
      MYSQL_DATABASE: locacao
      MYSQL_USER: locacao
      MYSQL_PASSWORD: locacao_local
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/prisma/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_apenas"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
